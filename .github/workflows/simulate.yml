name: Warehouse Simulation

on:
  push:
    branches:
      - main # mainブランチにプッシュされた時に発動

jobs:
  simulate-and-visualize:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub Actionsからリポジトリに書き込む権限

    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: シミュレーション実行 (main.py)
        run: python src/main.py

      - name: GIFの生成 (visualize.py)
        run: python src/visualize.py

      - name: 生成したGIFをコミットしてPush
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add output.gif
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate simulation GIF" && git push)
